[project]
name = "ebike-ai"
version = "0.1.0"
description = "电动车故障诊断 RAG 系统"
requires-python = ">=3.10"
dependencies = [
    # 当前 Python 3.10 环境验证基线；升级时同步验证并更新版本。
    "langchain-community==0.4.2",
    "langchain-chroma==1.1.0",
    "langchain-text-splitters==1.1.2",
    "langchain-core==1.4.7",
    "dashscope==1.25.22",
    "chromadb==1.5.9",
    "docx2txt==0.9",
    "pypdf==6.13.2",
    "fastapi==0.137.1",
    "pydantic==2.13.4",
    "uvicorn==0.49.0",
    "tenacity==9.1.4",
    "pandas==2.3.3",
    "matplotlib==3.10.9",
    "openpyxl==3.1.5",
    "pyserial==3.5",
]

[project.optional-dependencies]
dev = [
    "pytest==9.1.0",
    "allure-pytest==2.16.0",
    "httpx==0.28.1",
    "requests==2.34.2",
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
testpaths = ["test_cases"]
pythonpath = ["src"]
addopts = "--strict-markers"
markers = [
    "unit: isolated logic with fixed data or fake collaborators",
    "integration: component interactions without real model services",
    "evaluation: Agent diagnosis quality checks",
    "live: real model or embedding calls; requires --run-live and DASHSCOPE_API_KEY",
]

[tool.setuptools.packages.find]
where = ["src"]


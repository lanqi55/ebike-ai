[project]
name = "ebike-ai"
version = "0.1.0"
description = "电动车故障诊断 RAG 系统"
requires-python = ">=3.10"
dependencies = [
    "langchain",
    "langchain-community",
    "langchain-chroma",
    "langchain-text-splitters",
    "langchain-core",
    "dashscope",
    "chromadb",
    "pytest",
    "docx2txt",
    "pypdf",
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
testpaths = ["test_cases"]
pythonpath = ["."]

name: CI - Offline tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch: # 手动重跑同一套离线检查，不开启付费评测

permissions:
  contents: read

jobs:
  test:
    name: Offline tests (Python 3.10)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # 离线 CI 不注入模型 Secret，也不从环境继承 --run-live。
      DASHSCOPE_API_KEY: ""
      PYTEST_ADDOPTS: ""
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: 安装依赖
        run: python -m pip install -e ".[dev]"
      - name: 检查依赖兼容性
        run: python -m pip check
      - name: 运行离线测试
        run: >-
          python -m pytest -m "not live and not db" -q -rs
          --junitxml=reports/ci/junit.xml
          --alluredir=reports/ci/allure-results
      - name: 保存测试报告（含失败结果）
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: offline-test-results
          path: |
            reports/ci/junit.xml
            reports/ci/allure-results/
          if-no-files-found: warn # 安装或收集失败时可能还没有报告，查看前面失败步骤
          retention-days: 7

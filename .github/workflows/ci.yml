name: CI                          # 工作流名字

on:                               # 什么时候触发
  push:                           #   push 代码时
    branches: [ main ]            #   推的是 main 分支

jobs:                             # 要干哪些"活"
  test:                           #   第一个活：跑测试
    runs-on: ubuntu-latest        #   在干净的 Linux 机器上跑
    steps:                        #   依次执行的步骤
      - uses: actions/checkout@v4          # ① 把代码 clone 下来
      - uses: actions/setup-python@v5      # ② 装 Python
        with:
          python-version: "3.10"
      - name: 安装依赖
        run: python -m pip install -e ".[dev]"  # ③ 安装运行及测试依赖
      - name: 检查依赖兼容性
        run: python -m pip check
      - name: 跑测试
        run: python -m pytest -v           # ④ 跑全部测试
